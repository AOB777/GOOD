<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.O.O.D | Luxury Delivery Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #FFFFFF;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
        }
        
        .logo-3d {
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            font-weight: 800;
            letter-spacing: 10px;
            background: linear-gradient(135deg, #8B6914 0%, #A67C1E 50%, #8B6914 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
        }
        
        .btn-gold {
            background: linear-gradient(135deg, #8B6914 0%, #A67C1E 100%);
            border: none;
            color: white;
            font-weight: 700;
            letter-spacing: 3px;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }
        
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(139,105,20,0.3);
            color: white;
        }
        
        .btn-outline-gold {
            background: transparent;
            border: 2px solid #8B6914;
            color: #8B6914;
            font-weight: 700;
            letter-spacing: 3px;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }
        
        .btn-outline-gold:hover {
            background: #8B6914;
            color: white;
        }
        
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
        }
        
        .rol-card {
            background: white;
            border: 1px solid rgba(139,105,20,0.2);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            height: 100%;
        }
        
        .rol-card:hover {
            transform: translateY(-5px);
            border-color: #A67C1E;
            box-shadow: 0 10px 30px rgba(139,105,20,0.1);
        }
        
        .rol-card.selected {
            border-color: #A67C1E;
            background: rgba(139,105,20,0.05);
            border-width: 2px;
        }
        
        .rol-icon {
            font-size: 3rem;
            color: #A67C1E;
            margin-bottom: 1rem;
        }
        
        .rol-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: #8B6914;
            margin-bottom: 0.5rem;
        }
        
        .rol-desc {
            font-size: 0.85rem;
            color: #6C757D;
        }
        
        @media (max-width: 768px) {
            .logo-3d {
                font-size: 2.5rem;
                letter-spacing: 5px;
            }
            .btn-gold, .btn-outline-gold {
                padding: 0.6rem 1.2rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

<section class="hero">
    <div class="container">
        <div class="text-center mb-5">
            <h1 class="logo-3d mb-4">G.O.O.D</h1>
            <p class="mb-3" style="letter-spacing: 8px; color: #8B6914; font-size: 0.9rem;">LUXURY DELIVERY SERVICE</p>
            <p class="mb-5" style="font-size: 1.2rem; color: #A67C1E; letter-spacing: 2px;">
                ENTREGAMOS MÁS QUE PAQUETES.<br>
                <span style="color: #8B6914;">ENTREGAMOS CONFIANZA.</span>
            </p>
        </div>
        
        <!-- Selector de rol -->
        <div class="row g-4 mb-5">
            <div class="col-md-4">
                <div class="rol-card" data-rol="comprador" onclick="seleccionarRol('comprador')">
                    <div class="rol-icon">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="rol-title">Comprador</div>
                    <div class="rol-desc">Compra productos y servicios de lujo</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="rol-card" data-rol="vendedor" onclick="seleccionarRol('vendedor')">
                    <div class="rol-icon">
                        <i class="fas fa-store"></i>
                    </div>
                    <div class="rol-title">Vendedor</div>
                    <div class="rol-desc">Vende tus productos en nuestra plataforma</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="rol-card" data-rol="repartidor" onclick="seleccionarRol('repartidor')">
                    <div class="rol-icon">
                        <i class="fas fa-truck"></i>
                    </div>
                    <div class="rol-title">Repartidor</div>
                    <div class="rol-desc">Realiza entregas y gana dinero</div>
                </div>
            </div>
        </div>
        
        <!-- Botones de acción -->
        <div class="text-center">
            <div class="d-flex gap-3 justify-content-center flex-wrap">
                <button id="btnRegistrar" class="btn-gold" onclick="irARegistro()" disabled>
                    <i class="fas fa-user-plus"></i> REGISTRARME
                </button>
                <a href="login.html" class="btn-outline-gold">
                    <i class="fas fa-sign-in-alt"></i> INICIAR SESIÓN
                </a>
            </div>
            <p class="mt-3 text-muted small">Selecciona un rol para registrarte</p>
        </div>
    </div>
</section>

<script>
let rolSeleccionado = null;

function seleccionarRol(rol) {
    rolSeleccionado = rol;
    
    // Remover selección de todas las cards
    document.querySelectorAll('.rol-card').forEach(card => {
        card.classList.remove('selected');
    });
    
    // Agregar selección a la card actual
    document.querySelector(`.rol-card[data-rol="${rol}"]`).classList.add('selected');
    
    // Habilitar botón de registro
    const btnRegistrar = document.getElementById('btnRegistrar');
    btnRegistrar.disabled = false;
    btnRegistrar.textContent = `REGISTRARME COMO ${rol.toUpperCase()}`;
}

function irARegistro() {
    if (!rolSeleccionado) {
        alert('Por favor, selecciona un rol primero');
        return;
    }
    
    const url = `registro_${rolSeleccionado}.html`;
    window.location.href = url;
}
</script>
</body>
</html>
