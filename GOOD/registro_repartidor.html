<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.O.O.D | Registro Repartidor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body { background: #F8F9FA; font-family: 'Montserrat', sans-serif; }
        .glass-card { background: white; border-radius: 20px; padding: 2rem; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .btn-gold { background: linear-gradient(135deg, #8B6914, #A67C1E); border: none; color: white; padding: 0.8rem; border-radius: 8px; width: 100%; font-weight: 600; }
        .form-label { color: #8B6914; font-weight: 600; }
        .form-control { border: 1px solid #ddd; border-radius: 8px; }
        .form-control:focus { border-color: #A67C1E; box-shadow: 0 0 0 3px rgba(139,105,20,0.1); }
        .logo { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; background: linear-gradient(135deg, #8B6914, #A67C1E); -webkit-background-clip: text; background-clip: text; color: transparent; text-decoration: none; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="text-center mb-4">
                <a href="index.html" class="logo">G.O.O.D</a>
                <p class="mt-2 text-muted">Registro como Repartidor</p>
                <p class="small text-muted">Recibirás un correo para verificar tu cuenta</p>
            </div>
            <div class="glass-card">
                <div id="alert" class="alert d-none"></div>
                <form id="registroForm" enctype="multipart/form-data">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">NOMBRE *</label>
                            <input type="text" class="form-control" name="nombre" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">APELLIDO *</label>
                            <input type="text" class="form-control" name="apellido" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">EMAIL *</label>
                        <input type="email" class="form-control" name="email" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">CONTRASEÑA *</label>
                            <input type="password" class="form-control" name="password" required>
                            <small class="text-muted">Mínimo 6 caracteres</small>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">CONFIRMAR *</label>
                            <input type="password" class="form-control" name="confirm_password" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">DNI *</label>
                            <input type="text" class="form-control" name="dni" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">LICENCIA *</label>
                            <input type="text" class="form-control" name="licencia" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">DOMICILIO *</label>
                        <input type="text" class="form-control" name="domicilio" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">PATENTE *</label>
                            <input type="text" class="form-control" name="patente" required placeholder="ABC123">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">SEGURO *</label>
                            <input type="text" class="form-control" name="seguro" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">FOTO DEL VEHÍCULO</label>
                        <input type="file" class="form-control" name="vehiculo_imagen" accept="image/jpeg,image/png,image/jpg">
                        <small class="text-muted">Formatos: JPG, PNG. Máximo 2MB</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">TELÉFONO</label>
                        <input type="tel" class="form-control" name="telefono">
                    </div>
                    <input type="hidden" name="rol" value="repartidor">
                    <button type="submit" class="btn-gold">REGISTRARME COMO REPARTIDOR</button>
                </form>
                <div class="text-center mt-3">
                    <a href="login.html" class="text-decoration-none" style="color: #A67C1E;">¿Ya tienes cuenta? Inicia sesión</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
document.getElementById('registroForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const alertDiv = document.getElementById('alert');
    alertDiv.classList.add('d-none');
    
    const password = document.querySelector('[name="password"]').value;
    const confirm = document.querySelector('[name="confirm_password"]').value;
    
    if (password !== confirm) {
        alertDiv.className = 'alert alert-danger';
        alertDiv.textContent = 'Las contraseñas no coinciden';
        alertDiv.classList.remove('d-none');
        return;
    }
    
    if (password.length < 6) {
        alertDiv.className = 'alert alert-danger';
        alertDiv.textContent = 'La contraseña debe tener al menos 6 caracteres';
        alertDiv.classList.remove('d-none');
        return;
    }
    
    // Validar DNI
    const dni = document.querySelector('[name="dni"]').value;
    if (!/^\d{7,8}$/.test(dni)) {
        alertDiv.className = 'alert alert-danger';
        alertDiv.textContent = 'El DNI debe tener 7 u 8 dígitos numéricos';
        alertDiv.classList.remove('d-none');
        return;
    }
    
    // Validar patente
    const patente = document.querySelector('[name="patente"]').value;
    if (!/^[A-Za-z0-9]{6,7}$/.test(patente)) {
        alertDiv.className = 'alert alert-danger';
        alertDiv.textContent = 'La patente debe tener 6 o 7 caracteres alfanuméricos';
        alertDiv.classList.remove('d-none');
        return;
    }
    
    // Validar email
    const email = document.querySelector('[name="email"]').value;
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) {
        alertDiv.className = 'alert alert-danger';
        alertDiv.textContent = 'Ingrese un email válido';
        alertDiv.classList.remove('d-none');
        return;
    }
    
    alertDiv.className = 'alert alert-info';
    alertDiv.textContent = 'Procesando registro...';
    alertDiv.classList.remove('d-none');
    
    const formData = new FormData(this);
    
    try {
        const response = await fetch('procesos/procesar_registro_repartidor.php', {
            method: 'POST',
            body: formData
        });
        
        const result = await response.json();
        
        if (result.success) {
            alertDiv.className = 'alert alert-success';
            alertDiv.textContent = result.message;
            alertDiv.classList.remove('d-none');
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 3000);
        } else {
            alertDiv.className = 'alert alert-danger';
            alertDiv.textContent = result.message;
            alertDiv.classList.remove('d-none');
        }
    } catch (error) {
        alertDiv.className = 'alert alert-danger';
        alertDiv.textContent = 'Error al conectar con el servidor';
        alertDiv.classList.remove('d-none');
    }
});
</script>
</body>
</html>
