<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.O.O.D | Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: #FFFFFF;
            font-family: 'Montserrat', sans-serif;
        }
        .glass-card {
            background: rgba(255,255,255,0.95);
            border: 1px solid rgba(139,105,20,0.2);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .btn-gold {
            background: linear-gradient(135deg, #8B6914 0%, #A67C1E 100%);
            border: none;
            color: white;
            font-weight: 700;
            letter-spacing: 3px;
            padding: 0.8rem 2rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            width: 100%;
        }
        .btn-gold:hover {
            background: linear-gradient(135deg, #A67C1E 0%, #C59B3C 100%);
            transform: translateY(-2px);
        }
        .logo-3d {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 10px;
            background: linear-gradient(135deg, #8B6914 0%, #A67C1E 50%, #8B6914 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-decoration: none;
        }
        .form-label {
            color: #8B6914;
            font-weight: 600;
        }
        .form-control {
            border: 1px solid rgba(139,105,20,0.25);
            border-radius: 8px;
        }
        .form-control:focus {
            border-color: #A67C1E;
            box-shadow: 0 0 0 3px rgba(139,105,20,0.1);
        }
    </style>
</head>
<body>

<section style="min-height: 100vh; display: flex; align-items: center;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-5">
                <div class="text-center mb-5">
                    <a href="index.html" class="logo-3d">G.O.O.D</a>
                </div>
                
                <div class="glass-card">
                    <h2 class="text-center mb-4" style="color: #8B6914;">INICIAR SESIÓN</h2>
                    
                    <div id="alertMessage" class="alert d-none" role="alert"></div>
                    
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">CORREO ELECTRÓNICO</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">CONTRASEÑA</label>
                            <input type="password" class="form-control" name="password" required>
                        </div>
                        
                        <button type="submit" class="btn-gold">INICIAR SESIÓN</button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p>¿No tienes cuenta? <a href="registro_comprador.html" style="color: #A67C1E;">Regístrate aquí</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const alertDiv = document.getElementById('alertMessage');
    alertDiv.classList.add('d-none');
    
    const formData = new FormData(this);
    
    try {
        const response = await fetch('procesos/procesar_login.php', {
            method: 'POST',
            body: formData
        });
        
        const result = await response.json();
        
        if (result.success) {
            alertDiv.className = 'alert alert-success';
            alertDiv.textContent = result.message;
            alertDiv.classList.remove('d-none');
            setTimeout(() => {
                window.location.href = result.redirect;
            }, 1000);
        } else {
            alertDiv.className = 'alert alert-danger';
            alertDiv.textContent = result.message;
            alertDiv.classList.remove('d-none');
        }
    } catch (error) {
        alertDiv.className = 'alert alert-danger';
        alertDiv.textContent = 'Error al conectar con el servidor. Asegúrate de que XAMPP esté corriendo.';
        alertDiv.classList.remove('d-none');
    }
});
</script>
</body>
</html>
